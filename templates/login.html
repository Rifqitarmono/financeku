<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceKu (Pencatatan Keuangan Harian)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Header Card -->
            <div class="login-header">
                <div class="brand-badge">
                    <span class="logo-box">◆</span>
                    <span class="brand-name">FINANCEKU</span>
                </div>
                <h2 class="login-title">Selamat Datang!</h2>
                <p class="login-subtitle">Aplikasi Pencatatan & Penghitung Keuangan Harian</p>
            </div>

            <!-- Pesan Error dengan Desain Modern -->
            {% if pesan_error %}
            <div class="alert-error" id="errorAlert">
                <div class="alert-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="alert-content">
                    <span class="alert-title">Gagal Masuk</span>
                    <p class="alert-text">{{ pesan_error }}</p>
                </div>
                <button type="button" class="alert-close" onclick="document.getElementById('errorAlert').style.display='none'">&times;</button>
            </div>
            {% endif %}

            <!-- Form Login -->
            <form action="/login" method="post" class="login-form">
                
                <!-- Input Username -->
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Masukkan username" 
                            autocomplete="username" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <!-- Input Password dengan Toggle Mata Show/Hide -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control password-input" 
                            placeholder="Masukkan password" 
                            autocomplete="current-password" 
                            required
                        >
                        <!-- Tombol Show / Hide Password -->
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="togglePasswordBtn" 
                            onclick="togglePasswordVisibility()" 
                            title="Tampilkan / Sembunyikan Password"
                            aria-label="Tampilkan / Sembunyikan Password"
                        >
                            <!-- Ikon Mata Terbuka -->
                            <svg id="eyeOpenIcon" class="eye-icon" viewBox="0 0 24 24" width="19" height="19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Ikon Mata Tertutup / Silang (Awalnya Sembunyi) -->
                            <svg id="eyeClosedIcon" class="eye-icon" viewBox="0 0 24 24" width="19" height="19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="btn-login">
                    <span>Masuk ke Dashboard</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Script Interaktif Show / Hide Password -->
    <script>
        function togglePasswordVisibility() {
            var pwdField = document.getElementById('password');
            var eyeOpen = document.getElementById('eyeOpenIcon');
            var eyeClosed = document.getElementById('eyeClosedIcon');

            if (pwdField.type === 'password') {
                pwdField.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                pwdField.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }
    </script>
</body>
</html>
